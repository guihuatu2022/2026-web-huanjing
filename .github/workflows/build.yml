# FrankenPHP 单文件运行时构建工作流
# 产物：frankenphp-linux-x86_64 和 frankenphp-linux-aarch64
# 包含：PHP 8.3 + 指定扩展 + Caddy + 指定模块
#
# 参考官方文档：https://frankenphp.dev/zh/docs/embed/

name: Build FrankenPHP Static Binary

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP 版本'
        required: true
        default: '8.3'
      
      php_extensions:
        description: 'PHP 扩展（逗号分隔）'
        required: true
        default: 'opcache,pdo_sqlite,sqlite3,curl,mbstring,gd,zip,openssl,fileinfo,dom,iconv,exif'
      
      php_extension_libs:
        description: '扩展依赖库（逗号分隔）'
        required: true
        default: 'libjpeg,libwebp,freetype'
      
      caddy_modules:
        description: 'Caddy 模块（逗号分隔，格式：module=repo@version 或 repo）'
        required: true
        default: 'github.com/dunglas/caddy-cbrotli,github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive,github.com/caddy-dns/cloudflare'
      
      architectures:
        description: '构建架构（both / amd64 / arm64）'
        required: true
        default: 'both'
      
      release_tag:
        description: 'Release 标签（留空则自动生成）'
        required: false
        default: ''

jobs:
  # ============================================================
  # 构建任务：为指定架构编译 FrankenPHP 静态二进制
  # ============================================================
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    
    strategy:
      matrix:
        include:
          - when: ${{ inputs.architectures == 'both' || inputs.architectures == 'amd64' }}
            arch: amd64
            platform: linux/amd64
            output_name: frankenphp-linux-x86_64
          - when: ${{ inputs.architectures == 'both' || inputs.architectures == 'arm64' }}
            arch: arm64
            platform: linux/arm64
            output_name: frankenphp-linux-aarch64
        exclude:
          - when: false
    
    steps:
      # ------------------------------------------------------------
      # 步骤 1：检出代码仓库
      # ------------------------------------------------------------
      - name: 检出仓库
        uses: actions/checkout@v4
      
      # ------------------------------------------------------------
      # 步骤 2：设置 QEMU（用于跨平台构建）
      # 当构建 arm64 时需要 QEMU 模拟器
      # ------------------------------------------------------------
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3
        if: ${{ matrix.arch == 'arm64' }}
      
      # ------------------------------------------------------------
      # 步骤 3：准备应用目录结构
      # FrankenPHP 静态构建器要求应用代码放在 /go/src/app/dist/app
      # ------------------------------------------------------------
      - name: 准备应用目录
        run: |
          mkdir -p dist/app/public
          
          cat > dist/app/public/index.php << 'EOF'
          <?php
          phpinfo();
          EOF
          
          cat > dist/app/Caddyfile << 'EOF'
          {
              auto_https off
          }
          
          :80 {
              root * /app/public
              php_server
          }
          EOF
      
      # ------------------------------------------------------------
      # 步骤 4：准备 PHP 扩展和 Caddy 模块参数
      # ------------------------------------------------------------
      - name: 准备构建参数
        id: params
        run: |
          # 将 PHP 扩展从逗号分隔转换为空格分隔
          PHP_EXT=$(echo "${{ inputs.php_extensions }}" | tr ',' ' ')
          echo "php_extensions=$PHP_EXT" >> $GITHUB_OUTPUT
          
          # 将依赖库从逗号分隔转换为空格分隔
          PHP_LIBS=$(echo "${{ inputs.php_extension_libs }}" | tr ',' ' ')
          echo "php_extension_libs=$PHP_LIBS" >> $GITHUB_OUTPUT
          
          # 将 Caddy 模块转换为 xcaddy 格式（每个模块前加 --with）
          CADDY_MODS=""
          IFS=',' read -ra MODULES <<< "${{ inputs.caddy_modules }}"
          for mod in "${MODULES[@]}"; do
            if [[ "$mod" == *"="* ]]; then
              mod_name="${mod%%=*}"
              mod_repo="${mod#*=}"
              CADDY_MODS="$CADDY_MODS --with $mod_name=$mod_repo"
            else
              CADDY_MODS="$CADDY_MODS --with $mod"
            fi
          done
          echo "caddy_modules=$CADDY_MODS" >> $GITHUB_OUTPUT
      
      # ------------------------------------------------------------
      # 步骤 5：创建 Dockerfile（根据官方文档）
      # 参考：https://frankenphp.dev/zh/docs/embed/
      # 
      # 使用 ARG 声明构建参数，在 RUN 中作为环境变量传递给 build-static.sh
      # ------------------------------------------------------------
      - name: 创建 Dockerfile
        run: |
          cat > Dockerfile << 'DOCKERFILE_END'
          ARG TARGETPLATFORM
          FROM --platform=${TARGETPLATFORM} dunglas/frankenphp:static-builder-gnu
          
          ARG PHP_VERSION=8.3
          ARG PHP_EXTENSIONS="opcache pdo_sqlite sqlite3 curl mbstring gd zip openssl fileinfo dom iconv exif"
          ARG PHP_EXTENSION_LIBS="libjpeg libwebp freetype"
          ARG XCADDY_ARGS=""
          
          WORKDIR /go/src/app/dist/app
          COPY dist/app .
          
          WORKDIR /go/src/app/
          RUN PHP_VERSION="${PHP_VERSION}" \
              PHP_EXTENSIONS="${PHP_EXTENSIONS}" \
              PHP_EXTENSION_LIBS="${PHP_EXTENSION_LIBS}" \
              XCADDY_ARGS="${XCADDY_ARGS}" \
              EMBED=dist/app/ \
              ./build-static.sh
          DOCKERFILE_END
      
      # ------------------------------------------------------------
      # 步骤 6：使用 docker build 构建（官方推荐方式）
      # ------------------------------------------------------------
      - name: 构建 FrankenPHP 静态二进制
        run: |
          docker build \
            --platform ${{ matrix.platform }} \
            --build-arg PHP_VERSION="${{ inputs.php_version }}" \
            --build-arg PHP_EXTENSIONS="${{ steps.params.outputs.php_extensions }}" \
            --build-arg PHP_EXTENSION_LIBS="${{ steps.params.outputs.php_extension_libs }}" \
            --build-arg XCADDY_ARGS="${{ steps.params.outputs.caddy_modules }}" \
            -t frankenphp-builder \
            -f Dockerfile .
      
      # ------------------------------------------------------------
      # 步骤 7：从 Docker 镜像中提取二进制文件
      # 官方提取方式：docker cp + docker rm
      # ------------------------------------------------------------
      - name: 提取二进制文件
        run: |
          mkdir -p out
          
          # 创建临时容器
          CONTAINER_ID=$(docker create --platform ${{ matrix.platform }} frankenphp-builder)
          
          # 复制二进制文件（官方路径：/go/src/app/dist/frankenphp-linux-xxx）
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            BINARY_NAME="frankenphp-linux-x86_64"
          else
            BINARY_NAME="frankenphp-linux-aarch64"
          fi
          
          docker cp "${CONTAINER_ID}:/go/src/app/dist/${BINARY_NAME}" "./out/${{ matrix.output_name }}"
          docker rm "${CONTAINER_ID}"
          
          chmod +x "./out/${{ matrix.output_name }}"
          
          echo "✓ 二进制文件已生成："
          ls -lh "./out/${{ matrix.output_name }}"
          file "./out/${{ matrix.output_name }}"
      
      # ------------------------------------------------------------
      # 步骤 8：验证 PHP 运行时和扩展
      # ------------------------------------------------------------
      - name: 验证 PHP 扩展
        run: |
          BINARY="./out/${{ matrix.output_name }}"
          
          echo "=== 验证 PHP 版本 ==="
          $BINARY php-cli -v
          
          echo ""
          echo "=== 验证 PHP 扩展 ==="
          EXTENSIONS=$($BINARY php-cli -m)
          
          MISSING=()
          IFS=',' read -ra REQUIRED <<< "${{ inputs.php_extensions }}"
          for ext in "${REQUIRED[@]}"; do
            if echo "$EXTENSIONS" | grep -qi "^${ext}$"; then
              echo "✓ $ext"
            else
              echo "✗ $ext (缺失)"
              MISSING+=("$ext")
            fi
          done
          
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo ""
            echo "错误：以下扩展缺失：${MISSING[*]}"
            exit 1
          fi
      
      # ------------------------------------------------------------
      # 步骤 9：验证 Caddy 模块
      # ------------------------------------------------------------
      - name: 验证 Caddy 模块
        run: |
          BINARY="./out/${{ matrix.output_name }}"
          
          echo "=== 验证 Caddy 模块 ==="
          MODULES=$($BINARY list-modules)
          
          MISSING=()
          IFS=',' read -ra REQUIRED <<< "${{ inputs.caddy_modules }}"
          for mod in "${REQUIRED[@]}"; do
            mod_path="${mod%%=*}"
            if echo "$MODULES" | grep -q "$mod_path"; then
              echo "✓ $mod_path"
            else
              echo "✗ $mod_path (缺失)"
              MISSING+=("$mod_path")
            fi
          done
          
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo ""
            echo "错误：以下模块缺失：${MISSING[*]}"
            exit 1
          fi
      
      # ------------------------------------------------------------
      # 步骤 10：功能测试
      # ------------------------------------------------------------
      - name: 功能测试
        run: |
          BINARY="./out/${{ matrix.output_name }}"
          
          echo "=== 启动 HTTP 服务 ==="
          $BINARY php-server --root dist/app/public &
          SERVER_PID=$!
          sleep 3
          
          echo ""
          echo "=== 测试 HTTP 响应 ==="
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          if [ "$RESPONSE" = "200" ]; then
            echo "✓ HTTP 服务正常响应 (状态码：$RESPONSE)"
          else
            echo "✗ HTTP 服务响应异常 (状态码：$RESPONSE)"
            kill $SERVER_PID || true
            exit 1
          fi
          
          echo ""
          echo "=== 测试 PHP 页面内容 ==="
          CONTENT=$(curl -s http://localhost:8080)
          if echo "$CONTENT" | grep -q "PHP Version"; then
            echo "✓ PHP 页面正常渲染"
          else
            echo "✗ PHP 页面渲染异常"
            kill $SERVER_PID || true
            exit 1
          fi
          
          echo ""
          echo "=== 测试 Brotli 压缩 ==="
          ENCODING=$(curl -s -H "Accept-Encoding: br" -D - http://localhost:8080 | grep -i "content-encoding" | tr -d '\r')
          if echo "$ENCODING" | grep -qi "br"; then
            echo "✓ Brotli 压缩已启用 ($ENCODING)"
          else
            echo "⚠ Brotli 压缩未检测到 ($ENCODING)"
          fi
          
          kill $SERVER_PID || true
          echo ""
          echo "✓ 功能测试完成"
      
      # ------------------------------------------------------------
      # 步骤 11：上传构建产物
      # ------------------------------------------------------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: out/${{ matrix.output_name }}
          retention-days: 30
          if-no-files-found: error
  
  # ============================================================
  # 发布任务：创建 GitHub Release
  # ============================================================
  release:
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ always() && contains(needs.build.result, 'success') }}
    
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: 整理发布文件
        run: |
          mkdir -p release
          find artifacts -type f -name 'frankenphp-linux-*' -exec cp {} release/ \;
          echo "=== 发布文件 ==="
          ls -lh release/
      
      - name: 生成 Release 标签
        id: release_tag
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            TAG="v$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: FrankenPHP ${{ steps.release_tag.outputs.tag }}
          body: |
            ## 构建信息
            
            - **PHP 版本**: ${{ inputs.php_version }}
            - **PHP 扩展**: ${{ inputs.php_extensions }}
            - **扩展依赖库**: ${{ inputs.php_extension_libs }}
            - **Caddy 模块**: ${{ inputs.caddy_modules }}
            - **构建架构**: ${{ inputs.architectures }}
            
            ## 使用方法
            
            ```bash
            # 启动 HTTP 服务
            ./frankenphp-linux-x86_64 php-server --root public/
            
            # 查看 PHP 扩展
            ./frankenphp-linux-x86_64 php-cli -m
            
            # 查看 Caddy 模块
            ./frankenphp-linux-x86_64 list-modules
            ```
          files: |
            release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
