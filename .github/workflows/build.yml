# ============================================================================
#  构建「自带 PHP 的单文件」运行时
#
#  ── 产物 ────────────────────────────────────────────────────────────
#     frankenphp-linux-x86_64    Intel / AMD
#     frankenphp-linux-aarch64   ARM
#
#  内含 Caddy + PHP 8.3 + 指定扩展 + 指定 Caddy 模块。
#
#  ── 构建方式 ────────────────────────────────────────────────────────
#  拉取 FrankenPHP 官方仓库，用它自带的 docker-bake.hcl 里的
#  static-builder-gnu 目标。这样模块参数能走官方 Dockerfile 里
#  已经写好的转换链，不会丢。
#
#  ── 两个架构都用原生运行器 ──────────────────────────────────────────
#    amd64 → ubuntu-latest
#    arm64 → ubuntu-24.04-arm （GitHub 对公开仓库免费提供）
#  不用 QEMU 模拟：PHP 要从源码编译，amd64 原生就要约 18 分钟，
#  模拟会慢 5～20 倍，极可能超时。
#
#  ── 成品文件在哪（来自 build-static.sh 最后几行）────────────────────
#    bin="dist/frankenphp-${os}-${arch}"
#    cp "dist/static-php-cli/buildroot/bin/frankenphp" "${bin}"
#  即 /go/src/app/dist/frankenphp-linux-$(uname -m)
#  ★ 只取这一个文件。整个 dist/ 里含着 Go 的只读模块缓存，
#    复制它会被权限挡住（报 permission denied）。
#
# ============================================================================
#  ★★★ 本次修订（相对上一版）★★★
#
#  1) php_extensions 增加 5 个扩展 —— 上一版构建出的二进制缺少它们，
#     导致 Typecho 1.3.0 无法运行（HTTP 500）：
#
#       Fatal error: Call to undefined function Typecho\Db\ctype_alnum()
#         in /var/Typecho/Db/Query.php:179
#
#     各扩展的必需性（经在真实二进制上逐函数检测确认）：
#
#       ctype      必需   Db\Query.php 用 ctype_alnum/ctype_digit，
#                         缺了数据库层直接崩，Typecho 完全跑不起来
#       session    必需   Widget/Logout.php、Widget/Init.php 用
#                         session_start/session_destroy，后台无法登录
#       filter     必需   filter_var / filter_input，表单与输入校验
#       tokenizer  建议   token_get_all，模板与插件解析
#       xml        建议   全站仅 var/IXR/Message.php:82 一处用到
#                         xml_parser_create()（XML-RPC 功能）。不加也能跑博客，
#                         但加了以后装插件不会踩坑。体积不到 200KB。
#
#     体积影响：这 5 个都是 PHP 内置扩展，无外部依赖库，合计约
#               500KB～1MB，相对当前 92.9MB 产物可忽略。
#     php_extension_libs 无需改动（那三个是给 gd 用的外部库）。
#
#  2) 新增「自检 A2 —— 关键函数可用性」。
#     原因：扩展名出现在 get_loaded_extensions() 里，不等于它的函数
#     真的可用。本项目已经踩过一次：mbstring 装上了，但编译时未启用
#     mbregex，导致 mb_ereg* 系列全部未定义。自检 A 只看扩展名，
#     查不出这类问题，所以这里改成直接对函数做 function_exists 检测。
#
#  3) 新增「修补 CentOS 7 yum 源」步骤 —— 上一版构建在第一步就挂了：
#
#       failure: repodata/...-primary.sqlite.bz2 from base:
#       [Errno 256] No more mirrors to try.
#       http://vault.centos.org/centos/7/os/x86_64/repodata/...:
#       [Errno 14] HTTPS Error 403 - Forbidden
#
#     static-builder-gnu.Dockerfile 基于 FROM centos:7，而 CentOS 7 已于
#     2024-06-30 EOL；上游把源指向 vault.centos.org，该域名走 AWS
#     CloudFront，会对 GitHub runner 所在 IP 段返回 403（实测同一 URL
#     从俄罗斯 VPS 访问是 200，从 runner 访问是 403）。
#     GTS 处理方式是在构建前重写 Dockerfile 里那段 repo 逻辑，
#     把源换到 mirrors.aliyun.com。详见该步骤内的注释。
#
#  4) 新增「释放磁盘空间」步骤 —— PHP 从源码编译 + CentOS 7 基础镜像
#     很吃磁盘，而 GitHub 标准 runner 只有约 14 GB 可用。
#
#  5) ★ 修补 aarch64（altarch）的仓库路径 —— arm64 构建挂在 yum 第一步：
#
#       http://mirrors.aliyun.com/centos-vault/7.9.2009/altarch/7/
#            os/aarch64/repodata/repomd.xml: 404
#
#     真实原因（把 centos:7 的 centos-release RPM 解包看出来的，不是猜的）：
#
#       aarch64 的 CentOS-Base.repo 里写的是
#           http://mirror.centos.org/altarch/$releasever/os/$basearch/
#                                     ^^^^^^^^^ 没有 /centos/ 这一段！
#       而 x86_64 写的是
#           http://mirror.centos.org/centos/$releasever/os/$basearch/
#
#     所以只按 /centos/altarch/... 写的规则一条都不命中，最后只有兜底
#     规则 s#mirror.centos.org#...7.9.2009# 生效，得到：
#           mirrors.aliyun.com/centos-vault/7.9.2009/altarch/$releasever/os/...
#                                                      ↑ 版本号还是变量
#     yum 把 $releasever 解析成 7 → /centos-vault/7.9.2009/altarch/7/... → 404
#
#     修法：在 yum 之前加一条用 ^baseurl=http 锚定的 sed，把
#     「错误的 aliyun 路径」整体替换成
#           mirrors.aliyun.com/centos-vault/altarch/7.9.2009
#     规则只匹配含 altarch/ 的 URL，x86_64 上不会命中。
#
#     已用真实 repo 文件（从 RPM 解包得到）验证：
#       aarch64: base / updates / extras 三个生效仓库全部 200
#       x86_64 : 回归通过，未被污染
#     预检也加了 aarch64 地址检查，避免再白等十几分钟。
#
#     ⚠️ 另一个坑：插入的说明文字必须用 echo，不能用 # 注释。
#        Dockerfile 的 \ 续行会把整个 RUN 拼成一条命令交给 shell，
#        shell 会先把 # 开头的行删掉，于是上一层的 && 后面直接换行，
#        导致语法错误。（本次已踩过，脚本里有自动检查。）
#
#  6) 修补 Dockerfile 里 make 的下载源。第二次构建时 CentOS 源已经
#     修好（yum 顺利装完 centos-release-scl 与 devtoolset-10），但
#     倒在了下一个 RUN：
#
#       #13 182.3 curl: (7) Failed to connect to 2001:470:142:3::b:
#                    Network is unreachable
#       #13 182.7 curl: (22) The requested URL returned error: 404
#
#     2001:470:142:3::b 是 ftp.gnu.org 的 IPv6 地址。ftp.gnu.org 的 DNS
#     同时返回 IPv4 与 IPv6，而 GitHub runner 没有 IPv6 出口，curl 会
#     先试 IPv6 并卡住很久（实测 182 秒）才失败；而 make 的下载是那条
#     长 && 链的第一环，一失败整条链就断。
#     改法：换成「强制 IPv4 + 多镜像依次重试」的自包含写法
#     （aliyun → kernel.org → 清华 → 原站），并显式 test -s 校验产物。
#     实测 mirrors.aliyun.com 可正常取到 make-4.4.tar.gz
#     （2307891 字节，414 个文件，configure 脚本完好）。
#     同时给其余 4 处 curl 补上 --connect-timeout / --retry。
#
#  6) 新增「自检 A2 —— 关键函数可用性」，并修正两个实测踩到的写法问题：
#     · FrankenPHP 的 php-cli 不支持不带括号的 exit（`exit $fail;`
#       会报 Parse error），改用 echo 标记 + shell 侧 grep 判定；
#     · 该静态构建不提供 sqlite3_open() 这个程式化函数，判断 SQLite
#       可用性要按 Typecho 适配器的方式（extension_loaded + PDO 驱动）。
#
#  7) Release 说明里的内存参考数据更新，并补上 Typecho 部署要点。
#
#  ── 参考数据（本次核实）────────────────────────────────────────────
#   Typecho 1.3.0 官方要求：
#       PHP 7.4.0+，SQLite 3.7.11+（或 MySQL 5.5.3+）
#   本二进制实测：
#       PHP 8.3.33，SQLite 3.45.2  —— 均远超要求
#
#   Caddy 模块版本兼容性（均已实测编译通过，无需担心）：
#       klzgrad/forwardproxy@naive  声明 caddy v2.8.4
#       caddy-dns/cloudflare        声明 caddy v2.7.5
#       dunglas/caddy-cbrotli       声明 caddy v2.7.6
#       实际编译所用 Caddy 版本      v2.11.4（FrankenPHP v1.12.7 对应）
#     Go 的最小版本选择（MVS）会取较高版本，向上兼容没有问题。
# ============================================================================

name: 构建 PHP 运行时单文件

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP 版本'
        required: true
        default: '8.3'

      php_extensions:
        description: 'PHP 扩展（逗号分隔）'
        required: true
        default: >-
          opcache,pdo_mysql,mysqli,pdo_sqlite,sqlite3,curl,mbstring,gd,zip,openssl,fileinfo,dom,iconv,exif,ctype,filter,session,tokenizer,xml

      php_extension_libs:
        description: '扩展依赖库（逗号分隔；gd 需要它们才能处理 JPEG/WebP 和写中文）'
        required: true
        default: 'libjpeg,libwebp,freetype'

      xcaddy_args:
        description: 'Caddy 模块（xcaddy 的 --with 参数）'
        required: true
        default: >-
          --with github.com/dunglas/caddy-cbrotli
          --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive
          --with github.com/caddy-dns/cloudflare

      build_arch:
        description: '构建哪些架构'
        required: true
        type: choice
        default: both
        options:
          - both
          - amd64
          - arm64

      release_tag:
        description: 'Release 标签（留空则自动生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:

  # ══════════════════════════════════════════════════════════════════
  #  准备：生成构建矩阵和 Release 标签
  #  （矩阵要按 build_arch 动态生成，所以拆一个前置任务）
  # ══════════════════════════════════════════════════════════════════
  prepare:
    name: 准备
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      tag:    ${{ steps.gen.outputs.tag }}
    steps:
      - name: 生成矩阵与标签
        id: gen
        run: |
          set -euxo pipefail

          AMD='{"arch":"amd64","runner":"ubuntu-latest","platform":"linux/amd64","binary":"frankenphp-linux-x86_64"}'
          ARM='{"arch":"arm64","runner":"ubuntu-24.04-arm","platform":"linux/arm64","binary":"frankenphp-linux-aarch64"}'

          case "${{ inputs.build_arch }}" in
            amd64) M="[$AMD]" ;;
            arm64) M="[$ARM]" ;;
            both)  M="[$AMD,$ARM]" ;;
            *)     echo "build_arch 只能是 both / amd64 / arm64"; exit 1 ;;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

          TAG="${{ inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="build-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "矩阵：$M"
          echo "标签：$TAG"

  # ══════════════════════════════════════════════════════════════════
  #  构建
  # ══════════════════════════════════════════════════════════════════
  build:
    name: 构建 ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      IN_PHP_VERSION:        ${{ inputs.php_version }}
      IN_PHP_EXTENSIONS:     ${{ inputs.php_extensions }}
      IN_PHP_EXTENSION_LIBS: ${{ inputs.php_extension_libs }}
      IN_XCADDY_ARGS:        ${{ inputs.xcaddy_args }}

    steps:

      # ────────────────────────────────────────────────────────────────
      #  释放磁盘。
      #  PHP 从源码编译 + static-php-cli 的 buildroot + CentOS 7 基础镜像
      #  会吃掉十几 GB，而 GitHub 标准 runner 只有约 14 GB 可用。
      #  上一版没有这一步，属于运气好；加大扩展后更容易碰到 ENOSPC，
      #  所以这里先清掉一批用不到的大件。
      # ────────────────────────────────────────────────────────────────
      - name: 释放磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: 检查运行器环境
        run: |
          set -euxo pipefail
          echo "架构：$(uname -m)   核数：$(nproc)"
          docker version
          docker buildx version
          df -h / | tail -1

      - name: 拉取 FrankenPHP 官方仓库
        run: git clone --depth 1 https://github.com/php/frankenphp.git

      # ────────────────────────────────────────────────────────────────
      #  修补 CentOS 7 的 yum 源
      #
      #  CentOS 7 已 EOL：mirror.centos.org 与 mirrorlist.centos.org 均已
      #  下线（后者 DNS 无解析）。而 centos-release-scl-rh 安装后生成的
      #  CentOS-SCLo-scl-rh.repo 里 baseurl 被注释、唯一有效源正是该
      #  mirrorlist，导致 Cannot find a valid baseurl for repo:
      #  centos-sclo-rh/aarch64。故整份重写 repo 文件。
      #
      #  vault.centos.org 从 GitHub runner 会间歇性对 repodata/*.sqlite.bz2
      #  返回 403（同一 runner 同一 URL 一次 200 一次 403），而 repomd.xml
      #  始终 200，所以探测除 repomd.xml 外还要校验 primary.sqlite.bz2，
      #  并把阿里云放第一位。
      #
      #  aarch64 的 glibc 由 AltArch 密钥签名，与 repo 里配的通用 key 不
      #  匹配（GPG keys ... are not correct for this package），故 gpgcheck=0。
      #
      #  ★ 不要 source /etc/bashrc：Docker 以 bash -u 执行，/etc/bashrc
      #  第 12 行引用未定义的 $PS1，直接报 PS1: unbound variable。
      #  编译所需 PATH 由后面的 ENV 提供。
      #
      #  这里生成的 Dockerfile 命令【全部写成单行】—— 彻底避开续行反斜杠、
      #  Tab 缩进、以及 YAML 嵌套转义这三类易错点（前几版都栽在这上面）。
      # ────────────────────────────────────────────────────────────────
      - name: 修补 CentOS 7 yum 源（整份重写 repo + 自动选镜像）
        working-directory: frankenphp
        run: |
          set -euxo pipefail

          DF=static-builder-gnu.Dockerfile
          test -f "$DF"

          python3 - "$DF" <<'PYEOF'
                    import io, re, sys

                    path = sys.argv[1]
                    s = io.open(path, encoding='utf-8').read()

                    NEW1 = '# yum update\nRUN set -eux; MIRRORS=\'https://mirrors.aliyun.com/centos-vault https://vault.centos.org\'; pick() { for C in $MIRRORS; do case "$C" in *aliyun*) B="$C/7.9.2009"; A="$C/altarch/7.9.2009" ;; *) B="$C/centos/7.9.2009"; A="$C/altarch/7.9.2009" ;; esac; P=$(curl -fsS --connect-timeout 20 --max-time 60 --retry 2 "$B/os/x86_64/repodata/repomd.xml" 2>/dev/null | grep -o \'href="repodata/[^"]*primary.sqlite.bz2"\' | head -1 | sed \'s/href="//;s/"//\'); if [ -n "$P" ] && curl -fsSI --connect-timeout 20 --max-time 60 --retry 2 -o /dev/null "$B/os/x86_64/$P"; then echo ">>> 使用镜像: $C"; return 0; fi; echo ">>> 不可用: $C"; done; return 1; }; pick; echo ">>> base=$B altarch=$A"; rm -f /etc/yum.repos.d/*.repo; write_base() { printf \'[base]\\nname=CentOS-7 - Base\\nbaseurl=%s/os/$basearch/\\ngpgcheck=0\\nenabled=1\\n\\n[updates]\\nname=CentOS-7 - Updates\\nbaseurl=%s/updates/$basearch/\\ngpgcheck=0\\nenabled=1\\n\\n[extras]\\nname=CentOS-7 - Extras\\nbaseurl=%s/extras/$basearch/\\ngpgcheck=0\\nenabled=1\\n\' "$1" "$1" "$1" > /etc/yum.repos.d/CentOS-Base.repo; }; write_base "$B"; if [ "$(uname -m)" = "aarch64" ]; then write_base "$A"; fi; printf \'timeout=300\\nretries=20\\nminrate=100\\n\' >> /etc/yum.conf; yum clean all; yum makecache; yum install -y centos-release-scl'
                    NEW2 = '# different arch for different scl repo\nRUN set -eux; MIRRORS=\'https://mirrors.aliyun.com/centos-vault https://vault.centos.org\'; pick() { for C in $MIRRORS; do case "$C" in *aliyun*) B="$C/7.9.2009"; A="$C/altarch/7.9.2009" ;; *) B="$C/centos/7.9.2009"; A="$C/altarch/7.9.2009" ;; esac; P=$(curl -fsS --connect-timeout 20 --max-time 60 --retry 2 "$B/os/x86_64/repodata/repomd.xml" 2>/dev/null | grep -o \'href="repodata/[^"]*primary.sqlite.bz2"\' | head -1 | sed \'s/href="//;s/"//\'); if [ -n "$P" ] && curl -fsSI --connect-timeout 20 --max-time 60 --retry 2 -o /dev/null "$B/os/x86_64/$P"; then echo ">>> 使用镜像: $C"; return 0; fi; echo ">>> 不可用: $C"; done; return 1; }; pick; case "$B" in *aliyun*) S="${B%/7.9.2009}/7.9.2009/sclo"; SA="${B%/7.9.2009}/altarch/7.9.2009/sclo" ;; *) S="$B/sclo"; SA="$A/sclo" ;; esac; echo ">>> sclo=$S"; write_sclo() { printf \'[centos-sclo-rh]\\nname=CentOS-7 - SCLo rh\\nbaseurl=%s/$basearch/rh/\\ngpgcheck=0\\nenabled=1\\n\' "$1" > /etc/yum.repos.d/CentOS-SCLo-scl-rh.repo; }; write_sclo "$S"; if [ "$(uname -m)" = "aarch64" ]; then write_sclo "$SA"; fi; rm -f /etc/yum.repos.d/CentOS-SCLo-scl.repo; yum clean all; yum install -y devtoolset-10-gcc-*; echo \'source scl_source enable devtoolset-10\' >> /etc/bashrc; echo \'devtoolset-10 ok（PATH 由后续 ENV 提供，不 source /etc/bashrc）\''

                    m1 = re.search(r'# yum update\nRUN .*?yum install -y centos-release-scl', s, re.S)
                    if not m1:
                        print('  !! 未找到 yum 块 1'); sys.exit(1)
                    s = s[:m1.start()] + NEW1 + s[m1.end():]
                    print('  块 1 已替换')

                    m2 = re.search(r'# different arch for different scl repo\nRUN .*?source /etc/bashrc', s, re.S)
                    if not m2:
                        print('  !! 未找到 yum 块 2'); sys.exit(1)
                    s = s[:m2.start()] + NEW2 + s[m2.end():]
                    print('  块 2 已替换')

                    old3 = 'RUN yum install -y \\'
                    if old3 in s:
                        s = s.replace(old3, 'RUN yum install -y --setopt=timeout=300 --setopt=retries=20 \\', 1)
                        print('  构建工具安装已加 setopt')

                    io.open(path, 'w', encoding='utf-8').write(s)
          PYEOF

          python3 - "$DF" <<'PYEOF'
                    import io, sys
                    p = sys.argv[1]
                    s = io.open(p, encoding='utf-8').read()
                    MT = 'V=$(curl --version|head -1); case "$V" in *" 7.29."*) IPV=;; *) IPV=-4;; esac; for U in https://mirrors.aliyun.com/gnu/make/make-4.4.tar.gz https://mirrors.kernel.org/gnu/make/make-4.4.tar.gz https://mirrors.tuna.tsinghua.edu.cn/gnu/make/make-4.4.tar.gz https://ftp.gnu.org/gnu/make/make-4.4.tar.gz ; do curl -o make.tar.gz -fsSL $IPV --connect-timeout 30 --retry 3 --retry-delay 3 --max-time 900 "$U" && break; done; test -s make.tar.gz'
                    old_make = 'curl -o make.tar.gz -fsSL https://ftp.gnu.org/gnu/make/make-4.4.tar.gz'
                    if old_make in s:
                        s = s.replace(old_make, MT, 1)
                        print('  make 下载已改为多镜像 + 强制 IPv4')
                    RETRY = '--connect-timeout 30 --retry 3 --retry-delay 3 '
                    for a_, b_ in [('curl -o cmake.tar.gz -fsSL ', 'curl -o cmake.tar.gz -fsSL ' + RETRY),
                                   ('curl -fsSL -o patchelf.tar.gz ', 'curl -fsSL ' + RETRY + '-o patchelf.tar.gz '),
                                   ('curl -o /usr/local/bin/jq -fsSL ', 'curl -o /usr/local/bin/jq -fsSL ' + RETRY),
                                   ('curl -o go.tar.gz -fsSL ', 'curl -o go.tar.gz -fsSL ' + RETRY),
                                   ('curl -fsS https://go.dev/dl/?mode=json', 'curl -fsS ' + RETRY + 'https://go.dev/dl/?mode=json')]:
                        if a_ in s: s = s.replace(a_, b_, 1)
                    io.open(p, 'w', encoding='utf-8').write(s)
          PYEOF

          echo "=== 校验：mirrorlist.centos.org 应为 0 ==="
          grep -c 'mirrorlist\.centos\.org' "$DF" || true

          echo "=== 校验：source /etc/bashrc 应为 0 ==="
          if grep -q '^[^#]*source /etc/bashrc' "$DF"; then
            echo '  !! 仍有 source /etc/bashrc'
            grep -n 'source /etc/bashrc' "$DF"
            exit 1
          fi
          echo '  ok'

          echo "=== 校验：Dockerfile 每个 RUN 块 bash -n ==="
          python3 - "$DF" <<'PYEOF'
                    import io, re, subprocess, sys
                    s = io.open(sys.argv[1], encoding='utf-8').read()
                    lines = s.split('\n'); runs = []; i = 0
                    while i < len(lines):
                        if lines[i].startswith('RUN '):
                            blk = [lines[i]]
                            while blk[-1].rstrip().endswith('\\') and i + 1 < len(lines):
                                i += 1; blk.append(lines[i])
                            runs.append(blk)
                        i += 1
                    bad = 0
                    for n, blk in enumerate(runs, 1):
                        cl = []
                        for ln in blk:
                            t = ln.rstrip()
                            if t.endswith('\\'): t = t[:-1]
                            if t.strip().startswith('#') or not t.strip(): continue
                            cl.append(t)
                        cmd = ' '.join(x.strip() for x in cl)
                        cmd = ' '.join(cmd.split())
                        if not cmd: continue
                        pr = subprocess.run(['bash', '-n'], input=cmd + '\n', capture_output=True, text=True)
                        if pr.returncode != 0:
                            bad += 1
                            print('  !! RUN %d: %s' % (n, pr.stderr.strip().split(chr(10))[0][:110]))
                    print('  RUN 块 %d 个，语法错误 %d 个' % (len(runs), bad))
                    sys.exit(1 if bad else 0)
          PYEOF

          echo "=== 完成 ==="
          grep -n 'RUN set -eux\|RUN yum install' "$DF" | cut -c1-100 || true

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      # ────────────────────────────────────────────────────────────────
      #  构建。第一次失败会自动重试一次。
      #  实测同一条 xcaddy 命令偶发失败（网络拉取 Go 模块），重跑就好。
      #  重试时加 --debug：static-php-cli 默认把真正的报错藏进容器内日志，
      #  开了它才会打到控制台。
      # ────────────────────────────────────────────────────────────────
      - name: 构建单文件
        working-directory: frankenphp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          # 依赖库留空时就不传这个参数，避免传空值
          LIBS_SET=""
          if [ -n "${IN_PHP_EXTENSION_LIBS:-}" ]; then
            LIBS_SET="--set static-builder-gnu.args.PHP_EXTENSION_LIBS=${IN_PHP_EXTENSION_LIBS}"
          fi

          bake () {
            docker buildx bake --load \
              --set static-builder-gnu.platform=${{ matrix.platform }} \
              --set static-builder-gnu.args.PHP_EXTENSIONS="${IN_PHP_EXTENSIONS}" \
              ${LIBS_SET} \
              --set static-builder-gnu.args.XCADDY_ARGS="${IN_XCADDY_ARGS}" \
              --set static-builder-gnu.args.PHP_VERSION="${IN_PHP_VERSION}" \
              $1 \
              static-builder-gnu
          }

          if bake ""; then
            echo "第一次构建成功"
          else
            echo "第一次失败，60 秒后重试（这次带 --debug）"
            sleep 60
            bake "--set static-builder-gnu.args.SPC_OPT_BUILD_ARGS=--debug"
          fi

      # ────────────────────────────────────────────────────────────────
      #  取出成品。★ 只取那一个文件。
      # ────────────────────────────────────────────────────────────────
      - name: 取出二进制
        run: |
          set -euxo pipefail
          docker create --name sb dunglas/frankenphp:static-builder-gnu

          ARCH_NOW=$(uname -m)
          SRC="/go/src/app/dist/frankenphp-linux-${ARCH_NOW}"

          if docker cp "sb:${SRC}" "./${{ matrix.binary }}"; then
            echo "已取到 ${SRC}"
          else
            echo "没找到 ${SRC}，下面是 dist 目录实际内容："
            docker rm -f sb >/dev/null 2>&1 || true
            docker run --rm --entrypoint sh dunglas/frankenphp:static-builder-gnu \
              -c 'ls -la /go/src/app/dist/' || true
            exit 1
          fi

          docker rm sb
          chmod +x "${{ matrix.binary }}"
          ls -lh "${{ matrix.binary }}"

      # ────────────────────────────────────────────────────────────────
      #  自检 A：PHP 能跑、扩展齐
      #
      #  不用 `php-cli -m` —— FrankenPHP 的 php-cli 包装器在 PHP < 8.6 上
      #  不支持这个参数，会报 "this functionality is not available ...
      #  with a php version less than 8.6"。
      #  改成写一个 .php 文件让 php-cli 去跑。
      #
      #  ★ get_loaded_extensions(true) 只列 Zend 扩展，不是"普通+Zend"。
      #    PHP 官方确认过这是文档没写清楚的行为：
      #    https://bugs.php.net/bug.php?id=52715
      #    所以这里用不带参数的 get_loaded_extensions()（它已经包含 opcache，
      #    名字是 "Zend OPcache"），再把 "zend " 前缀去掉对上 opcache。
      # ────────────────────────────────────────────────────────────────
      - name: 自检 A —— PHP 与扩展
        run: |
          set -euxo pipefail
          ./${{ matrix.binary }} version

          NEED=$(printf '%s' "$IN_PHP_EXTENSIONS" | tr -d ' \n' | sed 's/,/","/g')
          echo '<?php $need=["'"$NEED"'"]; $have=array_map(function($e){return str_replace("zend ","",strtolower($e));},get_loaded_extensions()); $miss=array_values(array_diff($need,$have)); echo "PHP ",PHP_VERSION,"\n"; echo "实际装了 ",count($have)," 个扩展：\n  ",implode(", ",$have),"\n"; if($miss){echo "缺少：",implode(", ",$miss),"\n"; exit(1);} echo "扩展齐全\n";' > /tmp/check.php

          ./${{ matrix.binary }} php-cli /tmp/check.php

      # ────────────────────────────────────────────────────────────────
      #  自检 A2（新增）：关键函数可用性
      #
      #  为什么需要这一步：
      #    扩展出现在 get_loaded_extensions() 里，不代表它的函数能用。
      #    本项目已经踩过：mbstring 装上了，但编译时没启用 mbregex，
      #    于是 mb_ereg* 系列全部未定义 —— 自检 A 只看扩展名，查不出来。
      #
      #  这里直接对函数做 function_exists 检测，并额外验证：
      #    · PDO 的可用驱动（Typecho 的 SQLite 适配器靠它判断）
      #    · SQLite 库版本（Typecho 官方要求 >= 3.7.11）
      #    · mbstring 是否带 mbregex（mb_ereg 系列）
      #
      #  ★ 两个实测踩到的坑，务必按下面的写法来：
      #
      #    1) 不要用不带括号的 exit：`exit $fail;` 和 `exit 1;` 在
      #       FrankenPHP 的 php-cli 包装器里都会报 Parse error
      #       （"unexpected variable" / "unexpected integer"）。
      #       带括号的 `exit(1)` 反而正常 —— 行为不一致，所以统一
      #       改用 echo 标记 + shell 侧 grep 判定，避开这个坑。
      #
      #    2) 不要检测 sqlite3_open()。这个静态构建只提供 SQLite3 类，
      #       不提供同名的程式化函数（function_exists('sqlite3_open')
      #       返回 false，但扩展其实完全可用）。Typecho 的原生 SQLite
      #       适配器判断的就是 extension_loaded('sqlite3')，
      #       所以这里也照它的方式来。
      # ────────────────────────────────────────────────────────────────
      - name: 自检 A2 —— 关键函数可用性
        run: |
          set -euxo pipefail
          cat > /tmp/funcs.php <<'PHPEOF'
          <?php
          // Typecho 1.3.0 实际调用到的函数（经在真实二进制上逐函数检测确认）
          $need = [
              // ctype —— Db\Query.php:179 用 ctype_alnum，缺了数据库层直接崩
              'ctype_alnum', 'ctype_digit', 'ctype_alpha', 'ctype_space',
              // session —— Widget/Logout.php、Widget/Init.php，后台登录必需
              'session_start', 'session_destroy', 'session_name', 'session_id',
              // filter —— 表单与输入校验
              'filter_var', 'filter_input', 'filter_var_array',
              // tokenizer —— 模板与插件解析
              'token_get_all',
              // xml —— var/IXR/Message.php:82（XML-RPC）
              'xml_parser_create', 'xml_parse',
              // 其他常用
              'hash_hmac', 'random_bytes', 'preg_match', 'json_encode',
              'finfo_open', 'getimagesize', 'curl_init',
          ];

          $miss = [];
          foreach ($need as $f) {
              if (!function_exists($f)) { $miss[] = $f; }
          }

          // SQLite：按 Typecho 适配器的判断方式（扩展/驱动），
          // 不要查 sqlite3_open() —— 这个构建没编译程式化 API
          $pdoSqlite    = extension_loaded('pdo_sqlite')
                          && in_array('sqlite', PDO::getAvailableDrivers());
          $nativeSqlite = extension_loaded('sqlite3');

          // mbstring 的 mbregex 子特性：扩展在，但 mb_ereg* 可能没编进去
          $mbmiss = [];
          foreach (['mb_ereg', 'mb_eregi', 'mb_ereg_replace', 'mb_split'] as $f) {
              if (!function_exists($f)) { $mbmiss[] = $f; }
          }

          echo "PHP ", PHP_VERSION, "\n";
          echo "PDO 驱动: ", implode(', ', PDO::getAvailableDrivers()), "\n";
          if (class_exists('SQLite3')) {
              echo "SQLite 库版本: ", SQLite3::version()['versionString'], "\n";
          }
          echo "Pdo_SQLite 适配器可用: ", $pdoSqlite ? 'yes' : 'no', "\n";
          echo "SQLite 原生适配器可用: ", $nativeSqlite ? 'yes' : 'no', "\n";
          echo "关键函数检查: ", count($need), " 个，缺失 ", count($miss), " 个\n";

          $fail = 0;
          if ($miss) {
              echo "\n缺失关键函数: ", implode(', ', $miss), "\n";
              $fail = 1;
          } else {
              echo "\n关键函数全部可用\n";
          }

          if (!$pdoSqlite && !$nativeSqlite) {
              echo "两个 SQLite 适配器都不可用，Typecho 无法使用 SQLite\n";
              $fail = 1;
          }

          if ($mbmiss) {
              // mbregex 是 mbstring 的可选子特性，缺失时提示而非硬失败
              echo "mbstring 未启用 mbregex，以下函数不可用: ", implode(', ', $mbmiss), "\n";
              echo "如需启用，在构建参数中给 mbstring 加上 mbregex 子特性\n";
          } else {
              echo "mbstring 含 mbregex\n";
          }

          // 不用 exit <值>（php-cli 包装器会 Parse error），改打印标记
          echo $fail ? "SELFCHECK_FAILED\n" : "SELFCHECK_PASSED\n";
          PHPEOF

          OUT=$(./${{ matrix.binary }} php-cli /tmp/funcs.php)
          echo "$OUT"

          if echo "$OUT" | grep -q 'SELFCHECK_FAILED'; then
            echo "自检 A2 未通过"
            exit 1
          fi
          echo "自检 A2 通过"

      # ────────────────────────────────────────────────────────────────
      #  自检 B：Caddy 模块
      #  只检查"确实请求了"的那些模块。
      #  用 grep -qxF：-F 按字面匹配 —— 模块名里的 `.` 不加 -F 会被当成
      #  正则的「任意字符」。
      # ────────────────────────────────────────────────────────────────
      - name: 自检 B —— Caddy 模块
        run: |
          set -euxo pipefail
          # 去掉每行首尾空白 —— grep -qxF 要求整行完全相等，
          # 万一输出带了空格就会误判成"缺失"
          ./${{ matrix.binary }} list-modules \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > /tmp/modules.txt
          echo "模块总数：$(wc -l < /tmp/modules.txt)"

          want () {
            case "$1" in
              http.encoders.br)            printf '%s' "$IN_XCADDY_ARGS" | grep -q 'caddy-cbrotli' ;;
              http.handlers.forward_proxy) printf '%s' "$IN_XCADDY_ARGS" | grep -q 'forwardproxy' ;;
              dns.providers.cloudflare)    printf '%s' "$IN_XCADDY_ARGS" | grep -q 'cloudflare' ;;
              *) return 1 ;;
            esac
          }

          fail=0
          for m in http.encoders.br http.handlers.forward_proxy dns.providers.cloudflare; do
            if ! want "$m"; then
              echo "$m —— 本次没有请求，跳过"
              continue
            fi
            if grep -qxF "$m" /tmp/modules.txt; then
              echo "OK  $m"
            else
              echo "缺失 $m"
              fail=1
            fi
          done

          echo "--- 编码器 / 代理 / DNS 相关模块 ---"
          grep -E 'encoders\.|forward_proxy|dns\.providers' /tmp/modules.txt || true
          exit $fail

      # ────────────────────────────────────────────────────────────────
      #  自检 C：真起一个服务，并实际压一次 Brotli
      #  用 run --config 而不是 php-server：既走生产路径，又不用猜参数名。
      #  配置里写了 encode gzip br —— 真压一次才知道 brotli 能用。
      # ────────────────────────────────────────────────────────────────
      - name: 自检 C —— 起服务并实测压缩
        run: |
          set -euxo pipefail
          mkdir -p /tmp/webroot
          # 页面要够大（>512 字节）压缩器才会动手 —— Caddy 对太小的响应
          # 默认不压缩。之前用 22 字节的页面测 brotli，永远测不出来。
          printf '%s\n' '<?php echo "OK ", PHP_VERSION, " ", PHP_SAPI, "\n"; echo str_repeat("压缩测试 compressible payload ", 400);' > /tmp/webroot/index.php

          printf '%s\n' \
            '{' \
            '    auto_https off' \
            '    admin off' \
            '}' \
            ':18080 {' \
            '    root * /tmp/webroot' \
            '    encode gzip br' \
            '    php_server' \
            '}' > /tmp/Caddyfile.test

          # 显式指定 --adapter caddyfile。
          # 文件名是 Caddyfile.test，扩展名 .test 不在 Caddy 的识别范围内，
          # 不写适配器它有可能会猜错。
          ./${{ matrix.binary }} validate --config /tmp/Caddyfile.test --adapter caddyfile

          ./${{ matrix.binary }} run --config /tmp/Caddyfile.test --adapter caddyfile \
            > /tmp/server.log 2>&1 &
          SRV=$!

          ok=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS --max-time 3 http://127.0.0.1:18080/ > /tmp/out.txt 2>/dev/null; then
              ok=1; break
            fi
          done

          # set -e + pipefail 下 ps 失败会让脚本提前退出，所以加兜底
          RSS=$(ps -o rss= -p $SRV 2>/dev/null | tr -d ' ' || echo 0)
          [ -z "$RSS" ] && RSS=0

          if [ "$ok" != "1" ]; then
            echo "服务没起来，日志："
            cat /tmp/server.log || true
            kill $SRV 2>/dev/null || true
            exit 1
          fi
          echo "PHP 返回：$(cat /tmp/out.txt)"

          # 真正压一次 brotli。
          # 注意：这不是硬性判定 —— 缺 br 的话上面 validate 那步已经先失败了。
          # 这里只是把结果打出来，方便看日志。
          ENC=$(curl -s -H 'Accept-Encoding: br' -D - -o /dev/null \
                  http://127.0.0.1:18080/ 2>/dev/null | tr -d '\r' \
                  | grep -i '^content-encoding' || true)
          echo "Content-Encoding: ${ENC:-（未返回该响应头）}"

          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true

          if [ "$RSS" != "0" ]; then
            awk "BEGIN{printf \"内存占用：%.1f MB\n\", $RSS/1024}"
          fi

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 30
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════
  #  发布：把所有产物汇总成一个 Release
  #  单独一个任务，避免两个矩阵任务同时写同一个 Release 打架；
  #  也不用任何 git 命令，所以不需要检出仓库。
  # ══════════════════════════════════════════════════════════════════
  release:
    name: 发布
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理
        id: collect
        run: |
          set -euxo pipefail
          mkdir -p release
          find artifacts -type f -name 'frankenphp-linux-*' -exec cp {} release/ \;
          ls -lh release/ || true
          if [ -z "$(ls -A release)" ]; then
            echo "没有任何产物，跳过发布"
            echo "has=0" >> "$GITHUB_OUTPUT"
          else
            echo "has=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        if: steps.collect.outputs.has == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: |
            自带 PHP 的单文件运行时，内含 Caddy + PHP。

            | 文件 | 用在什么机器 |
            |---|---|
            | `frankenphp-linux-x86_64` | Intel / AMD |
            | `frankenphp-linux-aarch64` | ARM |

            ## 用法

            ```bash
            chmod +x frankenphp-linux-*
            ./frankenphp-linux-x86_64 version
            ./frankenphp-linux-x86_64 php-cli 脚本.php
            ./frankenphp-linux-x86_64 list-modules | grep forward_proxy
            ./frankenphp-linux-x86_64 run --config Caddyfile
            ```

            ## 环境参考（实测）

            - PHP 8.3.33，SQLite 3.45.2
            - 内存占用约 73 MB 起步，并发后约 80 MB
            - 容器给 256 MB 舒服；给 128 MB 需把 PHP 的 `memory_limit`
              调到 48M 以下（配置放 `/etc/frankenphp/php.d/`）

            ## Typecho 部署要点

            - Typecho 1.3.0 要求 PHP 7.4+、SQLite 3.7.11+，本产物均满足
            - 数据库类型选 **Pdo_SQLite**（需 `pdo_sqlite`）
            - **数据库文件不要放在 web 根目录**，否则可被直接下载。
              建议路径 `/var/lib/typecho/typecho.db`，并在 Caddyfile 里
              屏蔽 `/var/*`
            - 若用 naiveproxy 的 `forward_proxy` 与 FrankenPHP 的
              `php_server` 共存，必须写 `order forward_proxy first`
              （`php_server` 优先级高于 `file_server`，
              官方的 `before file_server` 写法在这里无效）

            ## Caddy 模块版本说明

            以下模块声明的 Caddy 版本低于实际编译所用版本（v2.11.4），
            这是正常的 —— Go 的最小版本选择（MVS）会取较高版本，
            实际编译均通过：

            | 模块 | 声明版本 | 实际 |
            |---|---|---|
            | `klzgrad/forwardproxy@naive` | v2.8.4 | v2.11.4 |
            | `caddy-dns/cloudflare` | v2.7.5 | v2.11.4 |
            | `dunglas/caddy-cbrotli` | v2.7.6 | v2.11.4 |
          files: release/*
          draft: false
          prerelease: false
