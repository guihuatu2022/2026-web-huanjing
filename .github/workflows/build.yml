# ============================================================================
#  构建「岁月博客」运行时 —— 一个自带 PHP 的单文件
#
#  这个文件放在 blog-deploy 仓库的 .github/workflows/ 下。
#  推送后 GitHub 会自动构建，产物挂到 Releases 上，你下载回来就能用。
#
#  产物内含：
#    · Caddy 网页服务器
#    · PHP 8.3 运行时 + 博客需要的扩展
#    · naiveproxy（forwardproxy 模块）
#    · Cloudflare DNS 插件（DNS-01 申请 SSL 证书用）
#
#  构建一次约 30~90 分钟。之后除非要升级，不用再构建。
# ============================================================================

name: 构建运行时单文件

on:
  # 手动触发：在 GitHub 网页上点一下就能构建
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP 版本'
        required: false
        default: '8.3'
      frankenphp_version:
        description: 'FrankenPHP 版本（留空用 main）'
        required: false
        default: ''

  # 推 v 开头的 tag 时自动构建，例如 v1.0.0
  push:
    tags:
      - 'v*'

# 构建需要读仓库、写 Release
permissions:
  contents: write

jobs:
  build:
    name: 构建 linux-amd64 单文件
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      # ── PHP 扩展 ──────────────────────────────────────────────
      # pdo_sqlite/sqlite3 : 数据库
      # curl               : 调 OpenList、抓网站 logo
      # mbstring           : 中文字符串处理
      # gd                 : 生成缩略图、加工 logo
      # zip                : 导出打包
      # openssl            : AES-256-GCM 加密
      # fileinfo           : MIME 类型识别
      # dom+iconv          : 解析网站 HTML 找 favicon
      # exif               : 读照片的拍摄参数（相机/光圈/快门/ISO）
      #
      # 注意：不需要 session —— 会话是我们自己用 Cookie + 数据库实现的
      PHP_EXTENSIONS: >-
        opcache,pdo_sqlite,sqlite3,curl,mbstring,gd,zip,openssl,fileinfo,dom,iconv,exif

      # ── gd 的可选依赖库 ───────────────────────────────────────
      # static-php-cli 默认遵循"最小依赖原则"，不写这些的话：
      #   libjpeg   → 处理不了 JPEG
      #   libwebp   → 处理不了 WebP
      #   freetype  → 不能在图片上画文字（生成印章图标要用）
      PHP_EXTENSION_LIBS: >-
        libjpeg,libwebp,freetype

      # ── Caddy 额外模块 ────────────────────────────────────────
      # ★ caddy-cbrotli 必须显式写进来！
      #   FrankenPHP 默认自带它，但一旦我们自定义了 XCADDY_ARGS，
      #   默认值就被整个覆盖掉了 —— 少了它 php-server 会报
      #   "module not registered: http.encoders.br"
      # forwardproxy 用 klzgrad 的分支（带 naiveproxy 的流量 padding）
      # caddy-dns/cloudflare 用于 DNS-01 申请证书
      XCADDY_ARGS: >-
        --with github.com/dunglas/caddy-cbrotli
        --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive
        --with github.com/caddy-dns/cloudflare

    steps:
      - name: 拉取 FrankenPHP 源码（构建脚本在这里面）
        run: git clone --depth 1 https://github.com/php/frankenphp.git

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建单文件
        working-directory: frankenphp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          docker buildx bake --load \
            --set static-builder-gnu.platform=linux/amd64 \
            --set static-builder-gnu.args.PHP_EXTENSIONS="${PHP_EXTENSIONS}" \
            --set static-builder-gnu.args.PHP_EXTENSION_LIBS="${PHP_EXTENSION_LIBS}" \
            --set static-builder-gnu.args.XCADDY_ARGS="${XCADDY_ARGS}" \
            --set static-builder-gnu.args.PHP_VERSION="${{ inputs.php_version || '8.3' }}" \
            static-builder-gnu

      - name: 取出二进制
        run: |
          set -euxo pipefail
          docker create --name sb dunglas/frankenphp:static-builder-gnu
          docker cp sb:/go/src/app/dist/frankenphp-linux-x86_64 ./frankenphp-linux-x86_64
          docker rm sb
          chmod +x frankenphp-linux-x86_64
          ls -lh frankenphp-linux-x86_64

      - name: 自检 —— 二进制能不能跑，扩展齐不齐
        # 注意：不能用 `php-cli -m`，FrankenPHP 的这个参数要求 PHP >= 8.6
        #
        # 需要的扩展清单**从 PHP_EXTENSIONS 自动生成** ——
        # 之前这里手写了一份副本，结果 check.php 里删掉 session 后忘了同步，
        # 白白失败了一次。现在只有一个来源，不可能再对不上。
        run: |
          set -euxo pipefail
          ./frankenphp-linux-x86_64 version

          NEED=$(printf '%s' "$PHP_EXTENSIONS" | tr -d ' \n' | sed 's/,/","/g')
          # 两个要点：
          #   1) get_loaded_extensions(true) —— 必须传 true，
          #      否则 opcache 这类 Zend 扩展不在列表里，会误报"缺少"
          #   2) 无条件把实际扩展全打印出来 —— 万一以后又不匹配，
          #      看日志一眼就知道真实情况，不用再猜一轮
          echo '<?php $need=["'"$NEED"'"]; $have=array_map("strtolower",get_loaded_extensions(true)); $miss=array_values(array_diff($need,$have)); echo "PHP ",PHP_VERSION,"\n"; echo "实际装了 ",count($have)," 个扩展：\n  ",implode(", ",$have),"\n"; if($miss){echo "✗ 缺少：",implode(", ",$miss),"\n"; exit(1);} echo "✓ 需要的扩展全都在\n";' > /tmp/check.php

          ./frankenphp-linux-x86_64 php-cli /tmp/check.php

      - name: 自检 —— Caddy 模块齐不齐
        # 这一条是为了防止重犯同一个错：自定义 XCADDY_ARGS 时会覆盖掉默认模块。
        # 少了 brotli，php-server 直接起不来（报 module not registered）。
        run: |
          set -euxo pipefail
          MODS=$(./frankenphp-linux-x86_64 list-modules)
          echo "$MODS" | grep -q '^http.encoders.br$'            || { echo "✗ 缺少 Brotli 编码器 http.encoders.br"; exit 1; }
          echo "$MODS" | grep -q '^http.handlers.forward_proxy$' || { echo "✗ 缺少 naiveproxy http.handlers.forward_proxy"; exit 1; }
          echo "$MODS" | grep -q '^dns.providers.cloudflare$'    || { echo "✗ 缺少 dns.providers.cloudflare"; exit 1; }
          echo "✓ Caddy 模块齐全（brotli + naiveproxy + cloudflare DNS）"

      - name: 打包上传为 Release 附件
        # if: always() —— 自检即使失败，也别丢掉跑了 18 分钟的构建产物
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: 运行时 ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}
          body: |
            单文件运行时，内含 Caddy + PHP + naiveproxy + Cloudflare DNS。

            下载 `frankenphp-linux-x86_64` 后：
            ```bash
            chmod +x frankenphp-linux-x86_64
            ./frankenphp-linux-x86_64 php-server -r public   # 启动网站
            ./frankenphp-linux-x86_64 php-cli app/seed.php   # 建库
            ```
          files: frankenphp-linux-x86_64

      - name: 也存一份 Artifact（Release 失败时还能拿到）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frankenphp-linux-x86_64
          path: frankenphp-linux-x86_64
          retention-days: 30
          if-no-files-found: warn
